<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070c;color:#fff;font:15px Inter,system-ui,sans-serif}.card{width:min(420px,calc(100% - 48px));padding:32px;border:1px solid #ff2b2b55;border-radius:22px;background:#14080ccc;box-shadow:0 20px 60px #0008}h1{font-size:25px}p{color:#bbb;line-height:1.6}label{display:block;margin:22px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ffffff30;border-radius:10px;background:#ffffff0d;color:white}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,#ff2b2b,#a3001b);color:white;font-weight:700;cursor:pointer}a{display:inline-block;margin-top:18px;color:#ff8a94}</style></head>
<body><main class="card"><h1>Reset your password</h1><p>Enter the email address on your account. Django will prepare a secure reset link; locally, the message appears in the backend terminal.</p>
<form method="post">{% csrf_token %}{{ form.email.errors }}<label for="id_email">Email address</label>{{ form.email }}<button type="submit">Send reset link</button></form><a href="/login.html#signin">Back to sign in</a></main></body></html>
